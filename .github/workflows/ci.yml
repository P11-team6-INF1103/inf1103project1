name: CI Pipeline

on:
  push:
    branches: [ "main", "feature/io-and-location" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Python 3.11
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # Caching speeds up dependency installation
          cache-dependency-path: "library.txt"

      # 3. Install dependencies from library.txt
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r library.txt
          pip install pytest ruff

      # 4. Ruff (blocking)
      - name: Run Ruff Check
        run: ruff check .

      # 5. Pytest (blocking: any failure or an empty test run fails the job)
      - name: Run Pytest
        run: pytest tests/

      # 6. Docker build (validation only, no push), with GitHub Actions layer caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
